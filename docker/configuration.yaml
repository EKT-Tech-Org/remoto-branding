# Starter configuration written by the Remoto image on a brand-new box.
homeassistant:
  name: "Remoto"

# The usual defaults, minus zeroconf (it announces the upstream product name on the LAN).
# Existing boxes get the same list (replace-default-config.sh reads it between the markers).
