# Client box. Do not edit HA_VERSION by hand: /opt/remoto/update.sh sets it to a tested version.
services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:?run update.sh}
    restart: unless-stopped
    # Time to write its data on stop; the default 10s can cut a save short.
    stop_grace_period: 2m
    privileged: true
    network_mode: host
    environment:
      - TZ=${TZ:-Asia/Beirut}
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
