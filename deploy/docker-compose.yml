# Local test instance, built from this repo.
#   docker compose -f deploy/docker-compose.yml up -d --build   -> http://localhost:8123
services:
  homeassistant:
    container_name: remoto
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        HA_VERSION: ${HA_VERSION}
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
