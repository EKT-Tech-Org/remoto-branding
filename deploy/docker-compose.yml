# Local test instance (and template for client boxes).
# Start: docker compose -f deploy/docker-compose.yml up -d  -> http://localhost:8123
services:
  homeassistant:
    container_name: remoto
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION}
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
      - ../custom_components/remoto_branding:/config/custom_components/remoto_branding:ro
      - ../themes:/config/themes:ro
