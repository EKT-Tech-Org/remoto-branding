name: HA compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 4" # Thursdays, the day after upstream monthly/patch releases

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ekt-tech-org/remoto

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: pinned, start: fresh }
          - { channel: pinned, start: existing }
          - { channel: stable, start: fresh }
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream tag
        id: tag
        run: |
          if [ "${{ matrix.channel }}" = "pinned" ]; then
            echo "tag=$(grep ^HA_VERSION deploy/.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Remoto image
        run: |
          docker build -f docker/Dockerfile --build-arg HA_VERSION=${{ steps.tag.outputs.tag }} -t remoto:test .
          V=$(docker run --rm --entrypoint python3 remoto:test -c "from homeassistant.const import __version__; print(__version__)")
          B=$(python3 -c "import json;print(json.load(open('custom_components/remoto_branding/manifest.json'))['version'])")
          echo "HA_FULL=$V" >> "$GITHUB_ENV"
          echo "BRANDING=$B" >> "$GITHUB_ENV"
          echo "upstream $V, branding $B"

      - name: Check default_config list against upstream
        run: |
          for f in docker/configuration.yaml; do
            docker run --rm --entrypoint python3 -v "$PWD/tests/check_default_config.py:/check.py:ro" \
              -v "$PWD/$f:/conf.yaml:ro" remoto:test /check.py /conf.yaml
          done

      - name: Start instance (${{ matrix.start }} box)
        run: |
          mkdir -p ci-config
          if [ "${{ matrix.start }}" = "existing" ]; then
            # An existing box: its own config, no Remoto anywhere yet.
            printf 'default_config:\nfrontend:\nhistory:\n  exclude:\n    domains: [sun]\n' > ci-config/configuration.yaml
          fi
          docker run -d --name ha -p 8123:8123 -v "$PWD/ci-config:/config" remoto:test
          sleep 5 && docker logs ha 2>&1 | grep "\[remoto\]"
          if grep -q '^default_config:' ci-config/configuration.yaml; then
            echo "default_config still present (zeroconf would stay on)"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install && npx playwright install --with-deps chromium

      - name: Onboard and verify auto-setup
        run: npm run setup:ha

      - name: Branding checks
        run: npm run test:e2e

      - name: Config warnings
        if: always()
        run: docker logs ha 2>&1 | grep -iE "does not support YAML|invalid config|setup failed|remoto" || true

      - name: Logs on failure
        if: failure()
        run: docker logs ha | tail -200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.channel }}-${{ matrix.start }}
          path: |
            test-results/
            playwright-report/

      # Only images that passed every check above are published.
      # One tag serves both Intel/AMD boxes and Raspberry Pi (64-bit OS); Docker
      # picks the right one. The Dockerfile only copies files, so no emulation is needed.
      - uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.start == 'fresh'

      - name: Publish image (amd64 + arm64)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.start == 'fresh'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAGS="-t $IMAGE:$HA_FULL -t $IMAGE:$HA_FULL-$BRANDING"
          if [ "${{ matrix.channel }}" = "pinned" ]; then TAGS="$TAGS -t $IMAGE:latest"; fi
          # Build on the exact upstream version that was just tested, not the moving "stable" tag.
          docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile \
            --build-arg HA_VERSION=$HA_FULL $TAGS --push .
          docker buildx imagetools inspect $IMAGE:$HA_FULL
          echo "### Published \`$IMAGE:$HA_FULL\` (amd64 + arm64)" >> "$GITHUB_STEP_SUMMARY"
