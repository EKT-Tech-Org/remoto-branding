name: HA compatibility

# Follows upstream: tests the branding on the current stable and beta versions,
# and releases every stable version it passes on. A release named
# <upstream>-<branding> is what client boxes install (deploy/client/update.sh).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # daily: upstream ships monthly, patch releases on any day

permissions:
  contents: write # create the release
  issues: write # report a failed run

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.v.outputs.stable }}
      branding: ${{ steps.v.outputs.branding }}
      released: ${{ steps.v.outputs.released }}
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Read upstream versions
        id: v
        run: |
          stable=$(curl -fsSL https://version.home-assistant.io/stable.json | jq -er .homeassistant.default)
          beta=$(curl -fsSL https://version.home-assistant.io/beta.json | jq -er .homeassistant.default)
          branding=$(jq -er .version custom_components/remoto_branding/manifest.json)
          # A pre-release is a pair that passed the checks but not the install smoke test.
          if [ "$(gh release view "$stable-$branding" --json isPrerelease --jq .isPrerelease 2>/dev/null)" = "false" ]; then
            released=true
          else
            released=false
          fi

          legs=()
          # The daily run skips a stable pair that is already released.
          if [ "$released" = false ] || [ "${{ github.event_name }}" != "schedule" ]; then
            legs+=("{\"channel\":\"stable\",\"start\":\"fresh\",\"ha\":\"$stable\"}")
            legs+=("{\"channel\":\"stable\",\"start\":\"existing\",\"ha\":\"$stable\"}")
          fi
          # Outside a beta period the beta channel equals stable.
          if [ "$beta" != "$stable" ]; then
            legs+=("{\"channel\":\"beta\",\"start\":\"fresh\",\"ha\":\"$beta\"}")
          fi
          matrix=$(printf '%s\n' "${legs[@]}" | jq -sc .)

          {
            echo "stable=$stable"
            echo "branding=$branding"
            echo "released=$released"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "stable $stable, beta $beta, branding $branding, released=$released" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: resolve
    if: needs.resolve.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # Beta is an early warning; it never blocks a release.
    continue-on-error: ${{ matrix.channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      RELEASE: ${{ matrix.ha }}-${{ needs.resolve.outputs.branding }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install && npx playwright install --with-deps chromium

      - name: Check default_config list against upstream
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD/tests/check_default_config.py:/check.py:ro" \
            -v "$PWD/deploy/client/configuration.yaml:/conf.yaml:ro" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }} /check.py /conf.yaml

      - name: Existing box, before Remoto
        if: matrix.start == 'existing'
        run: |
          # A running stock installation with its own data and no Remoto anywhere.
          sudo mkdir -p /srv/ha/config
          printf 'default_config:\nfrontend:\n' | sudo tee /srv/ha/config/configuration.yaml >/dev/null
          docker run -d --name homeassistant --network host -v /srv/ha/config:/config \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha }}
          PHASE=stock npm run setup:ha

      - name: Install with setup.sh (${{ matrix.start }} box)
        run: sudo REMOTO_SOURCE="$PWD" bash deploy/client/setup.sh local "$RELEASE"

      - name: Verify auto-setup and kept data
        env:
          EXPECT_MARKER: ${{ matrix.start == 'existing' && '1' || '' }}
        run: npm run setup:ha

      - name: Branding checks
        run: npm run test:e2e

      - name: Run the update again
        run: |
          sudo REMOTO_SOURCE="$PWD" /opt/remoto/update.sh "$RELEASE"
          curl -fsS http://localhost:8123/auth/authorize | grep -q '<title>Remoto</title>'

      - name: Config warnings
        if: always()
        run: docker logs homeassistant 2>&1 | grep -iE "does not support YAML|invalid config|setup failed|remoto" || true

      - name: Logs on failure
        if: failure()
        run: docker logs homeassistant 2>&1 | tail -200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.channel }}-${{ matrix.start }}
          path: |
            test-results/
            playwright-report/

      - name: Report a failed daily run
        if: failure() && github.event_name == 'schedule'
        env:
          TITLE: Branding check failed on upstream ${{ matrix.ha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            printf '%s\n\n%s\n%s\n' \
              "The ${{ matrix.channel }} check (${{ matrix.start }} box) failed: $RUN_URL" \
              "No release was created for this version, so client boxes stay on the last tested one." \
              "Fix www/remoto.js or pages.py, then bump version in manifest.json." \
              | gh issue create --title "$TITLE" --body-file -
          fi

  # Only a pair that passed every stable check above is released.
  release:
    needs: [resolve, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.resolve.outputs.released == 'false'
    runs-on: ubuntu-latest
    env:
      STABLE: ${{ needs.resolve.outputs.stable }}
      BRANDING: ${{ needs.resolve.outputs.branding }}
      RELEASE: ${{ needs.resolve.outputs.stable }}-${{ needs.resolve.outputs.branding }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the release as a pre-release
        run: |
          # Boxes only follow full releases, so nothing reaches them yet.
          gh release view "$RELEASE" >/dev/null 2>&1 || gh release create "$RELEASE" --prerelease \
            --target "$GITHUB_SHA" \
            --title "Remoto $BRANDING on $STABLE" \
            --notes "Branding $BRANDING passed every check on upstream $STABLE. Move a box to it with /opt/remoto/update.sh."

      - name: Install it the way a technician does
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/deploy/client/setup.sh?ref=$RELEASE" \
            | sudo bash -s -- "$GH_TOKEN" "$RELEASE"
          curl -fsS http://localhost:8123/auth/authorize | grep -q '<title>Remoto</title>'

      - name: Publish the release
        run: |
          gh release edit "$RELEASE" --prerelease=false --latest
          echo "### Released \`$RELEASE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Report a failed release
        if: failure()
        env:
          TITLE: Release ${{ needs.resolve.outputs.stable }}-${{ needs.resolve.outputs.branding }} failed its install test
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            printf '%s\n\n%s\n' "$RUN_URL" "The release stays a pre-release, so client boxes do not get it." \
              | gh issue create --title "$TITLE" --body-file -
          fi
